name: Auto Solution Responder

on:
  issues:
    types: [opened]

jobs:
  reply-solution:
    runs-on: ubuntu-latest
    steps:
      - name: Create Solution Comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            🤖 **Automated Assistant:** 
            Aapka issue receive ho gaya hai! Iska potential solution yeh ho sakta hai:
            1. Check karein ki aapka code latest branch par ho (`git pull origin main`).
            2. Agar dependency ya syntax error hai, toh usko resolve karke commit karein.
          token: ${{ secrets.GITHUB_TOKEN }}